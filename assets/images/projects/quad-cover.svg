<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="Quad — database-first university network, database layer diagram">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141a"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <pattern id="qgrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#1a1d24" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#qbg)"/>
  <rect width="1600" height="900" fill="url(#qgrid)" opacity="0.75"/>
  <rect x="0" y="0" width="6" height="900" fill="#ffb454"/>

  <text x="110" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" letter-spacing="4" fill="#ffb454">DATABASE-FIRST · INTERFACE IN PROGRESS</text>

  <text x="110" y="330" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="104" font-weight="700" fill="#eef1f6">Quad</text>

  <text x="112" y="404" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="30" fill="#eef1f6" opacity="0.78">One profile for a student's studies, projects and collaborations.</text>
  <text x="112" y="450" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="30" fill="#eef1f6" opacity="0.78">Permissions are enforced in the database, not trusted to the interface.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="110" y="560" width="155" height="52" rx="10" fill="none" stroke="#23262f" stroke-width="2"/>
    <text x="128" y="594" fill="#eef1f6" opacity="0.9">52 tables</text>

    <rect x="285" y="560" width="208" height="52" rx="10" fill="none" stroke="#23262f" stroke-width="2"/>
    <text x="303" y="594" fill="#eef1f6" opacity="0.9">16 migrations</text>

    <rect x="513" y="560" width="260" height="52" rx="10" fill="none" stroke="#23262f" stroke-width="2"/>
    <text x="531" y="594" fill="#eef1f6" opacity="0.9">132 SQL functions</text>

    <rect x="793" y="560" width="300" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="2"/>
    <text x="811" y="594" fill="#ffb454">296 permission tests</text>
  </g>

  <line x1="110" y1="760" x2="1490" y2="760" stroke="#23262f" stroke-width="1"/>

  <text x="110" y="812" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#eef1f6" opacity="0.45">Schematic cover — the interface is still being built</text>
</svg>
