<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="School Management SaaS — multi-tenant school operations, self-hosted diagram">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141a"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <pattern id="sgrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 H0 V80" fill="none" stroke="#1a1d24" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sbg)"/>
  <rect width="1600" height="900" fill="url(#sgrid)" opacity="0.75"/>
  <rect x="0" y="0" width="6" height="900" fill="#ffb454"/>

  <text x="110" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" letter-spacing="4" fill="#ffb454">MULTI-TENANT · SELF-HOSTED</text>

  <text x="110" y="322" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="76" font-weight="700" fill="#eef1f6">School Management SaaS</text>

  <text x="112" y="396" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="30" fill="#eef1f6" opacity="0.78">Admissions, academics, finance, library, transport, hostel, inventory</text>
  <text x="112" y="442" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="30" fill="#eef1f6" opacity="0.78">and audit — running on a school's own server, with no cloud required.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="110" y="560" width="168" height="52" rx="10" fill="none" stroke="#23262f" stroke-width="2"/>
    <text x="128" y="594" fill="#eef1f6" opacity="0.9">Next.js 15</text>

    <rect x="298" y="560" width="142" height="52" rx="10" fill="none" stroke="#23262f" stroke-width="2"/>
    <text x="316" y="594" fill="#eef1f6" opacity="0.9">React 19</text>

    <rect x="460" y="560" width="142" height="52" rx="10" fill="none" stroke="#23262f" stroke-width="2"/>
    <text x="478" y="594" fill="#eef1f6" opacity="0.9">Prisma 6</text>

    <rect x="622" y="560" width="168" height="52" rx="10" fill="none" stroke="#ffb454" stroke-width="2"/>
    <text x="640" y="594" fill="#ffb454">PostgreSQL</text>
  </g>

  <line x1="110" y1="760" x2="1490" y2="760" stroke="#23262f" stroke-width="1"/>

  <text x="110" y="812" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#eef1f6" opacity="0.45">Schematic cover — no public screenshot yet</text>
</svg>
